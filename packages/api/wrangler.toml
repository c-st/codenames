# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "codenames-api"
main = "src/worker.ts"
compatibility_date = "2024-11-06"

send_metrics = false

# Delete room data after two weeks without connected players (minimum 60 seconds).
[vars]
ROOM_IDLE_TTL_SECONDS = "1209600"

[durable_objects]
bindings = [
  { name = "CODENAMES", class_name = "CodenamesGame" }
]

routes = [
  { pattern = "api.codenam.es", custom_domain = true }
]

[env.local]
vars = { WORKER_ENV = "local", ROOM_IDLE_TTL_SECONDS = "1209600" }
[env.local.durable_objects]
  bindings = [
    { name = "CODENAMES", class_name = "CodenamesGame" }
  ]

[[migrations]]
tag = "v1" # Should be unique for each new migration
new_classes = ["CodenamesGame"]

[limits]
cpu_ms = 100

[observability]
enabled = true